name: Generate Snake Animation

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          persist-credentials: false

      - name: Generate Snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: MingDuc1905
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=A855F7&color_dots=EBE7F5,D8C8F0,C3A8E8,A855F7,7E22CE
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=C084FC&color_dots=161B22,3B0764,6D28D9,A855F7,C084FC

      - name: Deploy to output branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
